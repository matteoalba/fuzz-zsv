services:
  fuzzer:
    user: fuzzer
    build:
      context: .
      dockerfile: Dockerfile
      args:
        TARGET_REPO:    ${TARGET_REPO}
        TARGET_VERSION: ${TARGET_VERSION}
        TARGET_NAME:    ${TARGET_NAME}
        FUZZER_MAX_LEN: ${FUZZER_MAX_LEN}

    image: fuzzer-${TARGET_NAME}:${TARGET_VERSION:-latest}
    restart: ${RESTART:-on-failure}

    environment:
      - FUZZER_MAX_TIME=${FUZZER_MAX_TIME}
      - FUZZER_MAX_LEN=${FUZZER_MAX_LEN}
      - FUZZER_JOBS=${FUZZER_JOBS}

    volumes:
      - corpus_shared:/home/fuzzer/corpus_shared
      - ./logs_local:/home/fuzzer/logs

    stdin_open: true
    tty: true

    env_file:
      - .env

volumes:
  corpus_shared:
